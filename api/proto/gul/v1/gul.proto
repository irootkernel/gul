syntax = "proto3";

package gul.v1;

option go_package = "github.com/rootkernel/gul/api/generated/go/gul/v1;gulv1";

import "google/protobuf/timestamp.proto";

// These declarations are a browser contract, not an enabled product route.
// Handlers remain unmounted until authenticated host assembly (E8-T3).
service AuthService {
  rpc FirstRunSetup(FirstRunSetupRequest) returns (FirstRunSetupResponse);
  rpc Login(LoginRequest) returns (LoginResponse);
  rpc Logout(LogoutRequest) returns (LogoutResponse);
  rpc GetSession(GetSessionRequest) returns (GetSessionResponse);
}

// Password bytes are bounded UTF-8 and cleared by the handler after use.
// Setup authority travels in a protected host-delivered header, never a URL.
message FirstRunSetupRequest { bytes password = 1; }
message FirstRunSetupResponse { BrowserSession session = 1; }
message LoginRequest { bytes password = 1; }
message LoginResponse { BrowserSession session = 1; }
message LogoutRequest {}
message LogoutResponse {}
message GetSessionRequest {}
message GetSessionResponse { BrowserSession session = 1; }

// No bearer token or client-selected subject is exposed by the browser API.
message BrowserSession {
  bool account_configured = 1;
  bool authenticated = 2;
  string csrf_token = 3;
  google.protobuf.Timestamp expires_at = 4;
}

service RuntimeService {
  rpc ListRuntimeProfiles(ListRuntimeProfilesRequest) returns (ListRuntimeProfilesResponse);
  rpc CheckCompatibility(CheckCompatibilityRequest) returns (CheckCompatibilityResponse);
}

enum RuntimeProfileCompatibility {
  RUNTIME_PROFILE_COMPATIBILITY_UNSPECIFIED = 0;
  RUNTIME_PROFILE_COMPATIBILITY_COMPATIBLE = 1;
  RUNTIME_PROFILE_COMPATIBILITY_INCOMPATIBLE = 2;
  RUNTIME_PROFILE_COMPATIBILITY_UNVERIFIED = 3;
  RUNTIME_PROFILE_COMPATIBILITY_UNAVAILABLE = 4;
}

enum LaunchExecutionLane {
  LAUNCH_EXECUTION_LANE_UNSPECIFIED = 0;
  LAUNCH_EXECUTION_LANE_DEDICATED = 1;
  LAUNCH_EXECUTION_LANE_SHARED_READONLY = 2;
}

enum LaunchAssurance {
  // Wire numbers are ordered from weakest to strongest assurance.
  LAUNCH_ASSURANCE_UNSPECIFIED = 0;
  LAUNCH_ASSURANCE_BEST_EFFORT_PERSONAL_ALPHA = 1;
  LAUNCH_ASSURANCE_VERIFIED_THREAD_SCOPED_CONTROL = 2;
  LAUNCH_ASSURANCE_STRONG_PROCESS_CONTAINMENT = 3;
}

message RuntimeModelChoice {
  string model_id = 1;
  bool is_default = 2;
  repeated string supported_efforts = 3;
}

message RuntimeProfileChoice {
  string name = 1;
  RuntimeProfileCompatibility compatibility = 2;
  string runtime_version = 3;
  repeated RuntimeModelChoice models = 4;
  repeated LaunchExecutionLane supported_lanes = 5;
  LaunchAssurance maximum_assurance = 6;
  repeated string feature_flags = 7;
  repeated string supported_interactions = 8;
  string access_policy_transition = 9;
  string background_execution = 10;
  bool native_subagents_enabled = 11;
}

message ListRuntimeProfilesRequest {}

message ListRuntimeProfilesResponse {
  repeated RuntimeProfileChoice profiles = 1;
  repeated string preprovisioned_policy_names = 2;
  string shared_readonly_warning = 3;
}

message CheckCompatibilityRequest {
  string profile_name = 1;
  string model_id = 2;
  string effort = 3;
  LaunchExecutionLane lane = 4;
  LaunchAssurance required_assurance = 5;
  string policy_name = 6;
  bool acknowledge_shared_readonly = 7;
}

message ProspectiveLaunchConfiguration {
  string profile_name = 1;
  string model_id = 2;
  string effort = 3;
  LaunchExecutionLane lane = 4;
  LaunchAssurance required_assurance = 5;
  string policy_name = 6;
  // First-release values are fixed: direct_interactive, interactive,
  // interactive_client, and dolgorae_orchestrated_session respectively.
  string control_mode = 7;
  string purpose = 8;
  string controller_kind = 9;
  string orchestration_use_case = 10;
  string shared_readonly_warning = 11;
}

message CheckCompatibilityResponse {
  ProspectiveLaunchConfiguration configuration = 1;
}

service WorkspacePresentationService {
  rpc ListRegistrableRoots(ListRegistrableRootsRequest) returns (ListRegistrableRootsResponse);
  rpc BrowseRegistrableRoot(BrowseRegistrableRootRequest) returns (BrowseRegistrableRootResponse);
  rpc RegisterFromHostSelection(RegisterFromHostSelectionRequest) returns (RegisterWorkspaceResponse);
  rpc RegisterFromAllowlistPath(RegisterFromAllowlistPathRequest) returns (RegisterWorkspaceResponse);
  rpc RevalidateWorkspace(RevalidateWorkspaceRequest) returns (RevalidateWorkspaceResponse);
  rpc ListWorkspaces(ListWorkspacesRequest) returns (ListWorkspacesResponse);
  rpc RenameWorkspace(RenameWorkspaceRequest) returns (WorkspacePresentationResponse);
  rpc SetWorkspaceFavorite(SetWorkspaceFavoriteRequest) returns (WorkspacePresentationResponse);
  rpc SetWorkspaceHidden(SetWorkspaceHiddenRequest) returns (WorkspacePresentationResponse);
  rpc RemoveWorkspaceEntry(RemoveWorkspaceEntryRequest) returns (RemoveWorkspaceEntryResponse);
  rpc GetNavigation(GetNavigationRequest) returns (NavigationResponse);
  rpc SetNavigation(SetNavigationRequest) returns (NavigationResponse);
}

message RemoveWorkspaceEntryRequest { string workspace_id = 1; }
message RemoveWorkspaceEntryResponse {}

message ListRegistrableRootsRequest {}

message RegistrableRoot {
  string root_id = 1;
  string label = 2;
}

message ListRegistrableRootsResponse {
  repeated RegistrableRoot roots = 1;
}

message BrowseRegistrableRootRequest {
  string root_id = 1;
  string relative_path = 2;
}

message RegistrableDirectory {
  string name = 1;
  string relative_path = 2;
}

message BrowseRegistrableRootResponse {
  repeated RegistrableDirectory directories = 1;
}

message RegisterFromHostSelectionRequest {}

message RegisterFromAllowlistPathRequest {
  string root_id = 1;
  string relative_path = 2;
}

message WorkspaceEntry {
  string workspace_id = 1;
  string display_name = 2;
  bool hidden = 3;
  bool favorite = 4;
}

message RenameWorkspaceRequest {
  string workspace_id = 1;
  string display_name = 2;
}

message SetWorkspaceFavoriteRequest {
  string workspace_id = 1;
  bool favorite = 2;
}

message SetWorkspaceHiddenRequest {
  string workspace_id = 1;
  bool hidden = 2;
}

message WorkspacePresentationResponse {
  WorkspaceEntry workspace = 1;
}

message GetNavigationRequest {}

message SetNavigationRequest {
  string workspace_id = 1;
  string session_id = 2;
}

message NavigationResponse {
  string workspace_id = 1;
  string session_id = 2;
}

message RegisterWorkspaceResponse {
  WorkspaceEntry workspace = 1;
  bool cancelled = 2;
}

message RevalidateWorkspaceRequest {
  string workspace_id = 1;
}

message RevalidateWorkspaceResponse {
  WorkspaceEntry workspace = 1;
}

message ListWorkspacesRequest {}

message ListWorkspacesResponse {
  repeated WorkspaceEntry workspaces = 1;
}

service DirectSessionService {
  rpc ListConversation(ListConversationRequest) returns (ListConversationResponse);
  rpc GetConversationEntry(GetConversationEntryRequest) returns (GetConversationEntryResponse);
  rpc ListDirectSessions(ListDirectSessionsRequest) returns (ListDirectSessionsResponse);
  rpc GetDirectSessionPresentation(GetDirectSessionPresentationRequest) returns (DirectSessionPresentationResponse);
  rpc RenameDirectSession(RenameDirectSessionRequest) returns (DirectSessionPresentationResponse);
  rpc SetDirectSessionFavorite(SetDirectSessionFavoriteRequest) returns (DirectSessionPresentationResponse);
  rpc SetDirectSessionArchived(SetDirectSessionArchivedRequest) returns (DirectSessionPresentationResponse);
  rpc ListPromptHistory(ListPromptHistoryRequest) returns (ListPromptHistoryResponse);
  rpc GetPromptHistoryItem(GetPromptHistoryItemRequest) returns (GetPromptHistoryItemResponse);
  rpc GetExecutionState(GetExecutionStateRequest) returns (GetExecutionStateResponse);
  rpc ListSpecialistResults(ListSpecialistResultsRequest) returns (ListSpecialistResultsResponse);
  rpc CloseRuntime(CloseRuntimeRequest) returns (CloseRuntimeResponse);
}

message DirectSessionPresentation {
  string session_id = 1;
  string workspace_id = 2;
  string display_name = 3;
  bool favorite = 4;
  bool archived = 5;
}

message GetDirectSessionPresentationRequest {
  string session_id = 1;
}

message RenameDirectSessionRequest {
  string session_id = 1;
  string display_name = 2;
}

message SetDirectSessionFavoriteRequest {
  string session_id = 1;
  bool favorite = 2;
}

message SetDirectSessionArchivedRequest {
  string session_id = 1;
  bool archived = 2;
}

message DirectSessionPresentationResponse {
  DirectSessionPresentation session = 1;
}

message ListDirectSessionsRequest {
  string workspace_id = 1;
}

message ListDirectSessionsResponse {
  repeated DirectSessionPresentation sessions = 1;
}

service ArtifactPresentationService {
  rpc GetMetadata(GetMetadataRequest) returns (GetMetadataResponse);
  rpc ReadChunk(ReadChunkRequest) returns (ReadChunkResponse);
}

enum ConversationKind {
  CONVERSATION_KIND_UNSPECIFIED = 0;
  CONVERSATION_KIND_HUMAN = 1;
  CONVERSATION_KIND_ASSISTANT = 2;
