}

message WatchClientEventsRequest {
  string session_id = 1;
  uint64 after_delivery_sequence = 2;
}

enum ClientEventKind {
  CLIENT_EVENT_KIND_UNSPECIFIED = 0;
  CLIENT_EVENT_KIND_PROJECTION_INVALIDATED = 1;
  CLIENT_EVENT_KIND_SNAPSHOT_REQUIRED = 2;
