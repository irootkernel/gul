service InteractionPresentationService {
  rpc ListPending(ListPendingRequest) returns (ListPendingResponse);
  rpc GetCard(GetCardRequest) returns (GetCardResponse);
  rpc Resolve(ResolveRequest) returns (ResolveResponse);
}
enum InteractionCardKind {
  INTERACTION_CARD_KIND_UNSPECIFIED = 0;
  INTERACTION_CARD_KIND_COMMAND_APPROVAL = 1;
  INTERACTION_CARD_KIND_FILE_APPROVAL = 2;
  INTERACTION_CARD_KIND_USER_INPUT = 3;
  INTERACTION_CARD_KIND_UNSUPPORTED = 4;
}
enum InteractionCardStatus {
  INTERACTION_CARD_STATUS_UNSPECIFIED = 0;
  INTERACTION_CARD_STATUS_PENDING = 1;
  INTERACTION_CARD_STATUS_RESOLVED = 2;
  INTERACTION_CARD_STATUS_STALE = 3;
}
enum InteractionCardDecision {
  INTERACTION_CARD_DECISION_UNSPECIFIED = 0;
  INTERACTION_CARD_DECISION_ACCEPT_ONCE = 1;
  INTERACTION_CARD_DECISION_DECLINE = 2;
  INTERACTION_CARD_DECISION_CANCEL = 3;
}
enum InteractionResolutionOutcome {
  INTERACTION_RESOLUTION_OUTCOME_UNSPECIFIED = 0;
  INTERACTION_RESOLUTION_OUTCOME_UNKNOWN = 4;
  INTERACTION_RESOLUTION_OUTCOME_RESOLVED = 1;
  INTERACTION_RESOLUTION_OUTCOME_REENTER = 2;
  INTERACTION_RESOLUTION_OUTCOME_STALE = 3;
}
message InteractionCardSummary {
  string interaction_id = 1;
  InteractionCardKind kind = 2;
  InteractionCardStatus status = 3;
  google.protobuf.Timestamp created_at = 4;
  optional google.protobuf.Timestamp expires_at = 5;
  optional google.protobuf.Timestamp resolved_at = 6;
  bool contains_protected_input = 7;
  bool requires_user_escalation = 8;
}
message CommandApprovalCard {
  string title = 1;
  string message = 2;
  string reason = 3;
  repeated string command = 4;
  string relative_working_directory = 5;
}
message FileChangeCard {
  string relative_path = 1;
  string kind = 2;
  string unified_diff = 3;
  string relative_move_path = 4;
}
message FileApprovalCard {
  string title = 1;
  string message = 2;
  string reason = 3;
  repeated FileChangeCard changes = 4;
  string verified_diff = 5;
}
message InteractionChoice { string label = 1; string description = 2; }
message InteractionQuestionCard {
  string question_id = 1;
  string header = 2;
  string question = 3;
  bool allows_other = 4;
  bool is_secret = 5;
  repeated InteractionChoice choices = 6;
}
message UserInputCard { bool is_blocking = 1; repeated InteractionQuestionCard questions = 2; }
message UnsupportedInteractionCard { string blocker = 1; }
message InteractionCard {
  ActionFlags actions = 7;
  ActionBlocker blocker = 8;
  InteractionCardSummary summary = 1;
  repeated InteractionCardDecision decisions = 2;
  oneof detail {
    CommandApprovalCard command_approval = 10;
    FileApprovalCard file_approval = 11;
    UserInputCard user_input = 12;
    UnsupportedInteractionCard unsupported = 13;
  }
}
message ListPendingRequest { string session_id = 1; }
message ListPendingResponse { repeated InteractionCardSummary summaries = 1; }
message GetCardRequest { string session_id = 1; string interaction_id = 2; }
message GetCardResponse { InteractionCard card = 1; }
message ResolveRequest {
  string session_id = 1;
  string interaction_id = 2;
  // One-shot raw JSON bytes, bounded before JSON parsing; never retained/replayed.
  bytes response_json = 3;
}
message ResolveResponse {
  InteractionResolutionOutcome outcome = 1;
  string resolution_receipt = 2;
  optional InteractionCard pending_card = 3;
}

service WriterActionService {
  rpc GetActionState(GetActionStateRequest) returns (GetActionStateResponse);
  rpc AcquireWriter(AcquireWriterRequest) returns (AcquireWriterResponse);
  rpc ReleaseWriter(ReleaseWriterRequest) returns (ReleaseWriterResponse);
}

enum ActionWriteIntent {
  ACTION_WRITE_INTENT_UNSPECIFIED = 0;
  ACTION_WRITE_INTENT_READ = 1;
  ACTION_WRITE_INTENT_WRITE = 2;
}
enum ActionCloseIntent {
  ACTION_CLOSE_INTENT_UNSPECIFIED = 0;
  ACTION_CLOSE_INTENT_NONE = 1;
  ACTION_CLOSE_INTENT_COMPLETE = 2;
  ACTION_CLOSE_INTENT_ABORT = 3;
}
enum WriterAuthority {
  WRITER_AUTHORITY_UNSPECIFIED = 0;
  WRITER_AUTHORITY_NONE = 1;
  WRITER_AUTHORITY_RESERVED = 2;
  WRITER_AUTHORITY_ACTIVE = 3;
  WRITER_AUTHORITY_HANDOFF_PREPARED = 4;
  WRITER_AUTHORITY_RELEASING = 5;
  WRITER_AUTHORITY_BLOCKED_UNKNOWN = 6;
}
enum WriterEffectiveAccess {
  WRITER_EFFECTIVE_ACCESS_UNSPECIFIED = 0;
  WRITER_EFFECTIVE_ACCESS_READ = 1;
  WRITER_EFFECTIVE_ACCESS_WRITE = 2;
  WRITER_EFFECTIVE_ACCESS_TRANSITIONING = 3;
  WRITER_EFFECTIVE_ACCESS_UNSUPPORTED = 4;
  WRITER_EFFECTIVE_ACCESS_UNKNOWN = 5;
}
enum WriterPolicyVerification {
  WRITER_POLICY_VERIFICATION_UNSPECIFIED = 0;
  WRITER_POLICY_VERIFICATION_VERIFIED = 1;
  WRITER_POLICY_VERIFICATION_UNVERIFIED = 2;
  WRITER_POLICY_VERIFICATION_FAILED = 3;
}
enum WriterOwner {
  WRITER_OWNER_UNSPECIFIED = 0;
  WRITER_OWNER_UNOWNED = 1;
  WRITER_OWNER_THIS_SESSION = 2;
  WRITER_OWNER_EXTERNAL_MANAGEMENT = 3;
}
enum ActionBlocker {
  ACTION_BLOCKER_UNSPECIFIED = 0;
  ACTION_BLOCKER_NONE = 1;
  ACTION_BLOCKER_PROVIDER_INCOMPATIBLE = 2;
  ACTION_BLOCKER_FRESH_SNAPSHOT_REQUIRED = 3;
  ACTION_BLOCKER_CREDENTIAL_BLOCKED = 4;
  ACTION_BLOCKER_UNRESOLVED_OUTCOME = 5;
  ACTION_BLOCKER_BACKGROUND_BLOCKED = 6;
  ACTION_BLOCKER_WRITER_BUSY = 7;
  ACTION_BLOCKER_UNSUPPORTED_TRANSITION = 8;
  ACTION_BLOCKER_ACTIVE_TURN_DRAFT = 9;
  ACTION_BLOCKER_INTERRUPT_CONFIRMATION_REQUIRED = 10;
  ACTION_BLOCKER_RECOVERY_BLOCKED = 11;
  ACTION_BLOCKER_PROVIDER_FAILURE = 12;
}
message ActionFlags {
  bool can_submit_read = 1;
  bool can_submit_write = 2;
  bool can_acquire_writer = 3;
  bool can_release_writer = 4;
  bool can_interrupt = 5;
  bool can_resolve_interaction = 6;
  bool can_recover = 7;
  bool can_reconcile = 8;
  bool can_adopt_controller = 9;
  bool can_pause_primary = 10;
  bool can_resume_primary = 11;
  bool can_request_session_close = 12;
  bool requires_close_confirmation = 13;
  bool requires_operator_action = 14;
  bool requires_fresh_snapshot = 15;
  bool blocked_by_outcome_unknown = 16;
  bool blocked_by_credential_state = 17;
  bool blocked_by_background_execution = 18;
  bool blocked_by_provider_compatibility = 19;
}
message WriterPresentation {
  WriterAuthority authority = 1;
  uint64 generation = 2;
  WriterEffectiveAccess effective_access = 3;
  WriterPolicyVerification policy_verification = 4;
  LaunchExecutionLane lane = 5;
  LaunchAssurance requested_assurance = 6;
  LaunchAssurance achieved_assurance = 7;
  WriterOwner owner = 8;
  bool background_blocked = 9;
  bool recovery_blocked = 10;
}
message ActionState {
  ActionFlags flags = 1;
  ActionBlocker blocker = 2;
  WriterPresentation writer = 3;
  WriterAccessMode mode = 4;
}
message GetActionStateRequest {
  string session_id = 1;
  ActionWriteIntent write_intent = 2;
  ActionCloseIntent close_intent = 3;
  bool interrupt_confirmed = 4;
}
message GetActionStateResponse { ActionState state = 1; }
message AcquireWriterRequest { string session_id = 1; }
message AcquireWriterResponse { ActionState state = 1; }
message ReleaseWriterRequest { string session_id = 1; }
message ReleaseWriterResponse { ActionState state = 1; }
message ActionFailure { ActionBlocker blocker = 1; }

// FileService reads only from a previously verified Workspace Entry. Its
// handlers remain unmounted until authenticated product route assembly.
service FileService {
  rpc InspectPath(InspectPathRequest) returns (InspectPathResponse);
  rpc ListDirectory(ListDirectoryRequest) returns (ListDirectoryResponse);
  rpc ReadPreview(ReadPreviewRequest) returns (ReadPreviewResponse);
  rpc RefreshFiles(RefreshFilesRequest) returns (RefreshFilesResponse);
  rpc GetGitStatus(GetGitStatusRequest) returns (GetGitStatusResponse);
  rpc CompareFixedRevisions(CompareFixedRevisionsRequest) returns (CompareFixedRevisionsResponse);
  rpc WatchFileChanges(WatchFileChangesRequest) returns (stream FileChange);
}

message InspectPathRequest {
  string workspace_id = 1;
  string relative_path = 2;
}

enum FileNodeKind {
  FILE_NODE_KIND_UNSPECIFIED = 0;
  FILE_NODE_KIND_DIRECTORY = 1;
  FILE_NODE_KIND_REGULAR_FILE = 2;
}

message InspectPathResponse {
  FileNodeKind kind = 1;
  uint64 byte_length = 2;
}

message ListDirectoryRequest {
  string workspace_id = 1;
  string relative_path = 2;
  uint32 page_size = 3;
  string page_token = 4;
}

message FileEntry {
  string name = 1;
  FileNodeKind kind = 2;
  uint64 byte_length = 3;
  bool provider_managed_denied = 4;
}

message ListDirectoryResponse {
  repeated FileEntry entries = 1;
  string next_page_token = 2;
}

message ReadPreviewRequest {
  string workspace_id = 1;
  string relative_path = 2;
}

enum FilePreviewKind {
  FILE_PREVIEW_KIND_UNSPECIFIED = 0;
  FILE_PREVIEW_KIND_TEXT = 1;
  FILE_PREVIEW_KIND_MARKDOWN = 2;
  FILE_PREVIEW_KIND_RASTER = 3;
  FILE_PREVIEW_KIND_SVG_SOURCE = 4;
  FILE_PREVIEW_KIND_UNSUPPORTED = 5;
}

message MarkdownImage {
  string reference = 1;
  string mime_type = 2;
  bytes data = 3;
}

message ReadPreviewResponse {
  FilePreviewKind kind = 1;
  string text = 2;
  bytes image = 3;
  string mime_type = 4;
  string language = 5;
  bool truncated = 6;
  repeated MarkdownImage markdown_images = 7;
}

message RefreshFilesRequest { string workspace_id = 1; }
message RefreshFilesResponse { uint64 revision = 1; }

enum FileGitState {
  FILE_GIT_STATE_UNSPECIFIED = 0;
  FILE_GIT_STATE_AVAILABLE = 1;
  FILE_GIT_STATE_NOT_REPOSITORY = 2;
  FILE_GIT_STATE_UNBORN_HEAD = 3;
  FILE_GIT_STATE_UNAVAILABLE = 4;
  FILE_GIT_STATE_LIMIT_EXCEEDED = 5;
}

enum FileChangeKind {
  FILE_CHANGE_KIND_UNSPECIFIED = 0;
  FILE_CHANGE_KIND_CLEAN = 1;
  FILE_CHANGE_KIND_MODIFIED = 2;
  FILE_CHANGE_KIND_ADDED = 3;
  FILE_CHANGE_KIND_UNTRACKED = 4;
  FILE_CHANGE_KIND_DELETED = 5;
  FILE_CHANGE_KIND_RENAMED = 6;
  FILE_CHANGE_KIND_CONFLICTED = 7;
  FILE_CHANGE_KIND_MIXED = 8;
}

message GetGitStatusRequest {
  string workspace_id = 1;
  string relative_path = 2;
}
message GetGitStatusResponse {
  FileGitState state = 1;
  FileChangeKind direct = 2;
  FileChangeKind aggregate = 3;
  bool staged = 4;
  bool unstaged = 5;
}

message CompareFixedRevisionsRequest {
  string workspace_id = 1;
  string relative_path = 2;
}
message CompareFixedRevisionsResponse {
  FileGitState state = 1;
  FileChangeKind change = 2;
  ReadPreviewResponse head = 3;
  ReadPreviewResponse working = 4;
  bool head_missing = 5;
  bool working_missing = 6;
  string previous_relative_path = 7;
}

message WatchFileChangesRequest { string workspace_id = 1; }
message FileChange {
  uint64 revision = 1;
  string relative_path = 2;
}
